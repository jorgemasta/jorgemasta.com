name: Deploy

on:
  push:
    branches: [main]
  # Weekly rebuild so the Tokenizados episode list stays fresh (#25).
  # Episodes usually go out between Saturday and Monday; Tuesday 06:00 UTC catches them.
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

# Never run two deploys at once; a newer one supersedes a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx astro check
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
